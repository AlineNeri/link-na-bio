<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Conheça a Aline Neri e acesse WhatsApp, Pinterest, Instagram e catálogo.">
    <meta name="theme-color" content="#f8eff2">
    <title>Aline Neri | Loja</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <main class="bio-wrapper">
        <section class="bio-card" aria-labelledby="brand-name">
            <div class="brand-block">
                <div class="profile-orbit">
                    <div class="profile-img">
                        <img src="img/logo-bio.jpg" alt="Logo da Aline Neri" class="logo-img" decoding="async">
                    </div>
                </div>

                <div class="brand-copy">
                    <h1 id="brand-name">Aline Neri</h1>
                    <p class="tagline">O diferente é ser você</p>
                </div>
            </div>

            <div class="social-proof">
                <span class="online-dot" aria-hidden="true"></span>
                <span>Atendimento online</span>
            </div>

            <nav class="links" aria-label="Links de contato">
                <a class="btn" href="https://wa.me/5511965713890" target="_blank" rel="noopener noreferrer">
                    <i class="bi bi-whatsapp" aria-hidden="true"></i>
                    <span>WhatsApp</span>
                </a>

                <a class="btn" href="https://pin.it/wGDBJjjqQ" target="_blank" rel="noopener noreferrer">
                    <i class="bi bi-pinterest" aria-hidden="true"></i>
                    <span>Pinterest</span>
                </a>

                <a class="btn" href="https://instagram.com/loja_alineneri" target="_blank" rel="noopener noreferrer">
                    <i class="bi bi-instagram" aria-hidden="true"></i>
                    <span>Instagram</span>
                </a>

                <a class="btn" href="https://alineneri.github.io/catalogo-aline-neri/" target="_blank" rel="noopener noreferrer">
                    <i class="bi bi-book" aria-hidden="true"></i>
                    <span>Catálogo</span>
                </a>
            </nav>

            <footer class="quote">
                <p>Porque dELE, por ELE e para ELE são todas as coisas.</p>
            </footer>
        </section>
    </main>
</body>
</html>
